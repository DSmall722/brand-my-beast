name: PR guards

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-identity:
    name: commit-identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"

      - name: Check commit identity
        env:
          ALLOWED_COMMIT_EMAILS: ${{ vars.ALLOWED_COMMIT_EMAILS }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/ci/commit-identity.sh

  debug-markers:
    name: debug-markers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"

      - name: Check added lines for debug markers
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/ci/debug-markers.sh

  missing-tests:
    name: missing-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"

      - name: Warn when a fix or bug PR has no tests
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/ci/missing-tests.sh

  guard-self-check:
    name: guard-self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run guard self-checks
        run: sh scripts/ci/test-guards.sh
